      #   uses: wzieba/Firebase-Distribution-Github-Action@v1
      #   with:
      #     appId: ${{ github.event.inputs.flavor == 'prod' && secrets.FIREBASE_APP_ID_IOS_PROD || secrets.FIREBASE_APP_ID_IOS_DEV }}
